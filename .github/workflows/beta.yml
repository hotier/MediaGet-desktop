name: Beta release

# 触发方式：push `vX.Y.Z-beta.N` tag（例如 v0.4.0-beta.1）。
#
# **不要改 package.json**（2026-10-23 起）：分支上的 version 停在已发布的稳定号，
# beta 号由 `_build-win.yml` 在出包时从 tag 注入（`npm version --no-git-tag-version`），
# 产物里的版本、beta.yml 清单与应用内通道判据（`release-channel.ts` 认 `-beta.N` 后缀）
# 都还是那个完整的 beta 号。`_publish.yml` 只核对通道与「tag 基线不得低于分支版本」，
# 不再要求与 package.json 全等——全等那条正是逼着每次出 beta 都要为版本号单独提交的根源。
#
# 身份与稳定版完全分开：appId / productName `MediaGet (Beta)` / 安装目录 / userData /
# 产物名都由 electron-builder.beta.cjs 覆盖（见该文件注释）。发布的是 GitHub **prerelease**，
# 稳定版的 `releases/latest` 与 latest.yml 都看不到它。
#
# 手动触发只出包不发布：演练 beta 配置（版本号不注入，产物带分支上的基线号）。
on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:

# beta 同一时刻只允许一个在跑：两次发布撞在一起会互相覆盖附件。
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml

  build:
    needs: verify
    uses: ./.github/workflows/_build-win.yml
    with:
      channel: beta
      artifact_name: mediaget-desktop-win-beta

  publish:
    name: 发布 beta 版本
    needs: build
    if: github.event_name == 'push'
    permissions:
      # `gh release create/upload` 要写 Release 与附件
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      tag: ${{ github.ref_name }}
      channel: beta
      artifact_name: mediaget-desktop-win-beta
