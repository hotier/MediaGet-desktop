name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本不在这里硬编码：action-setup 会读 package.json 的 packageManager 字段，
      # 于是本机与 CI 永远同一档；升 pnpm 只改那一个字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test (vitest, offline)
        run: pnpm run test

  build-win:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本不在这里硬编码：action-setup 会读 package.json 的 packageManager 字段，
      # 于是本机与 CI 永远同一档；升 pnpm 只改那一个字段。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 固定 tag + 强校验 SHA-256，并产出 resources/bin/manifest.json（首启校验用）。
      # 不要退回 `curl -sL -o .../latest/download/...`：不带 --fail 时 404 的 HTML
      # 错误页会被原样写成 .exe，构建成功但产物是垃圾（静默投毒）。
      - name: Fetch yt-dlp / ffmpeg binaries (pinned + verified)
        run: node scripts/fetch-binaries.cjs
      # 守门人：manifest.json 是运行时完整性校验的唯一基线，缺了它应用会静默降级成
      # 「只定位不校验」。在打包前断言清单在位且与二进制自洽，让问题在构建期暴露。
      - name: Verify binaries + manifest before packaging
        run: node scripts/fetch-binaries.cjs --verify-only --require-all
      # 只构建、不发布：package.json 的 build.publish 配了 GitHub provider，
      # electron-builder 在 CI 里会默认尝试上传 Release，而本 job 没有 GH_TOKEN
      # ——实测报 "GitHub Personal Access Token is not set"。发布是 tag 工作流的事，
      # 所以这里不复用 `pnpm run build`（它会带上 auto-publish 语义），显式 never。
      - name: Build app + installer
        run: pnpm run build:app && pnpm exec electron-builder --win --publish never
      # 产物自检：安装包里必须真的带上 bin/ 与 manifest.json（extraResources 配错
      # 时构建仍会成功，但用户机器上两个二进制都不可用）。
      - name: Assert packaged resources landed in the installer
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem -Path release -Recurse -Directory -Filter 'win-unpacked' | Select-Object -First 1
          if (-not $unpacked) { throw "release/win-unpacked 不存在：打包产物缺失" }
          $bin = Join-Path $unpacked.FullName 'resources\bin'
          foreach ($f in @('yt-dlp.exe','ffmpeg.exe','manifest.json')) {
            $p = Join-Path $bin $f
            if (-not (Test-Path $p)) { throw "安装包内缺少 resources\bin\$f" }
            Write-Host "  OK $f ($((Get-Item $p).Length) 字节)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mediaget-desktop-win
          path: release/*
          if-no-files-found: warn
