name: Build Windows installer

# 可复用工作流：拉随包二进制 → 强校验 → 出 NSIS/portable → 断言产物 → 交 artifact。
# **只打包、绝不发布**：发布是 release.yml 末尾一次 gh release create 的事。
#
# 为什么打包与发布必须分开：这两段以前是两份拷贝（ci.build-win 与 release.publish），
# 已经漂移过 —— 资源落地断言与 latest.yml/blockmap 断言只长在 CI 那份上，于是
# 「CI 绿、发出去的 Release 少一个附件」是结构上可能的。现在两边跑的是同一段。

on:
  workflow_call:
    inputs:
      # 下划线而非连字符：表达式里 `inputs.a-b` 会被当成减法，别赌解析器的宽容度
      artifact_name:
        description: 产物 artifact 名（发布侧按这个名字取回，默认值与 release.yml 对齐）
        type: string
        default: mediaget-desktop-win
      channel:
        description: stable | beta；beta 走 electron-builder.beta.cjs 的独立身份
        type: string
        default: stable

jobs:
  build:
    name: 出包（publish never）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 这里不能跳过 electron 二进制：electron-builder 要真分发件。
      - uses: ./.github/actions/setup
        with:
          skip_electron: "0"

      # 固定 tag + 强校验 SHA-256，并产出 resources/bin/manifest.json（首启校验用）。
      # 不要退回 `curl -sL -o .../latest/download/...`：不带 --fail 时 404 的 HTML
      # 错误页会被原样写成 .exe，构建成功但产物是垃圾（静默投毒）。
      - name: Fetch yt-dlp / ffmpeg binaries (pinned + verified)
        run: node scripts/fetch-binaries.cjs

      # 守门人：manifest.json 是运行时完整性校验的唯一基线，缺了它应用会静默降级成
      # 「只定位不校验」。在打包前断言清单在位且与二进制自洽，让问题在构建期暴露。
      - name: Verify binaries + manifest before packaging
        run: node scripts/fetch-binaries.cjs --verify-only --require-all

      # beta 版本号只存在于 tag（2026-10-23 定）：分支上的 package.json 永远停在**已发布的
      # 稳定号**，出包时从触发 tag 注入完整的 `X.Y.Z-beta.N`。
      #
      # 为什么不能写在文件里：beta 号写进 dev 的 package.json，就等于每次出 beta 都要为版本号
      # 单独提交一笔，且 dev → main 合并前必须手工回落（旧 §3.4）——那一整类摩擦都来自这里。
      # 注入之后，产物里的版本、beta.yml 清单、应用内通道判据（`release-channel.ts` 只认
      # `-beta.N` 后缀）都还是那个完整的 beta 号，而分支历史里没有半句假版本。
      #
      # 手动触发（workflow_dispatch）没有 tag：`github.ref_name` 是分支名，注入会把版本变成
      # 垃圾字符串，所以只在 ref 形如 `v*-beta*` 时注入，演练保留 package.json 的基线号。
      - name: Inject beta version from tag
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$CHANNEL" != "beta" ]; then
            echo "stable 通道用 release-it 写好的 package.json 版本，不注入"
            exit 0
          fi
          case "$REF_NAME" in
            v*-beta*) version="${REF_NAME#v}" ;;
            *)
              echo "非 beta tag 触发（ref=$REF_NAME）：保留 package.json 版本，只演练出包"
              exit 0
              ;;
          esac
          # --workspaces=false：根件是 pnpm monorepo 宿主，别让 npm 顺手去改 landing/
          npm version "$version" --no-git-tag-version --workspaces=false
          echo "注入版本：$(node -p "require('./package.json').version")"

      # --publish never 是刻意的：package.json 的 build.publish 配了 GitHub provider，
      # electron-builder 默认会自己上传 Release（没有 token 时报 "GitHub Personal Access
      # Token is not set"，有 token 时会另建一个 Release 撞成两个）。所以不复用
      # `pnpm run build`，显式 never；发布动作统一由 _publish.yml 完成。
      #
      # beta 只换配置、不换代码：electron-builder.beta.cjs 在 package.json 的 build 上
      # 覆盖 appId / productName / executableName / 产物名 / publish.channel。
      - name: Build app + installer
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          pnpm run build:app
          if [ "$CHANNEL" = "beta" ]; then
            pnpm exec electron-builder --win --publish never --config electron-builder.beta.cjs
          else
            pnpm exec electron-builder --win --publish never
          fi

      # 产物自检其一：安装包里必须真的带上 bin/ 与 manifest.json（extraResources 配错
      # 时构建仍会成功，但用户机器上两个二进制都不可用）。
      - name: Assert packaged resources landed in the installer
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem -Path release -Recurse -Directory -Filter 'win-unpacked' | Select-Object -First 1
          if (-not $unpacked) { throw "release/win-unpacked 不存在：打包产物缺失" }
          $bin = Join-Path $unpacked.FullName 'resources\bin'
          foreach ($f in @('yt-dlp.exe','ffmpeg.exe','manifest.json')) {
            $p = Join-Path $bin $f
            if (-not (Test-Path $p)) { throw "安装包内缺少 resources\bin\$f" }
            Write-Host "  OK $f ($((Get-Item $p).Length) 字节)"
          }

      # 产物自检其二：更新链路的随包件。更新清单缺了，应用内「检测更新」永远查不到
      # 版本；*.blockmap 缺了，增量更新静默退化成整包下载。这两样以前只在发版那步才
      # 发现（而且「少传一个附件」并不会让发版红），现在在打包处就断。
      #
      # 通道各认各的名字：beta 若误生成 latest.yml，稳定版客户端会把 beta 当正式版升级。
      - name: Assert installer + update manifest
        shell: pwsh
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if ($env:CHANNEL -eq 'beta') {
            $setupPattern = 'MediaGet-Beta-Setup-*.exe'
            $archivePattern = 'MediaGet-Beta-*.7z'
            $ymlName = 'beta.yml'
          } else {
            $setupPattern = 'MediaGet-Setup-*.exe'
            $archivePattern = 'MediaGet-*.7z'
            $ymlName = 'latest.yml'
          }
          $setup = Get-ChildItem -Path release -Filter $setupPattern -ErrorAction SilentlyContinue
          if (-not $setup) { throw "release/ 下没有 NSIS 安装包（$setupPattern）：目录页/安装日志都落在它上面" }
          $archive = Get-ChildItem -Path release -Filter $archivePattern -ErrorAction SilentlyContinue
          if ($env:CHANNEL -eq 'stable') {
            # MediaGet-*.7z 也会匹配 MediaGet-Beta-*.7z，别让本地残留的 beta 包冒充正式版产物
            $archive = $archive | Where-Object { $_.Name -notmatch '-Beta-' } | Select-Object -First 1
          }
          if (-not $archive) { throw "release/ 下没有 7z 归档（$archivePattern）：绿色解压分发靠它" }
          $yml = Join-Path 'release' $ymlName
          if (-not (Test-Path $yml)) { throw "release/ 下缺少 $ymlName：应用内检测更新会永远查不到版本" }
          if ($env:CHANNEL -eq 'beta' -and (Test-Path (Join-Path 'release' 'latest.yml'))) {
            throw "beta 构建生成了 latest.yml：稳定版客户端会把 beta 当成正式版升级"
          }
          $blockmap = Get-ChildItem -Path release -Filter '*.exe.blockmap' -ErrorAction SilentlyContinue
          if (-not $blockmap) { throw "release/ 下缺少 *.exe.blockmap：增量更新会退化成整包下载" }
          Write-Host "  OK $($setup[0].Name) ($($setup[0].Length) 字节) + $($archive[0].Name) ($($archive[0].Length) 字节) + $ymlName + $($blockmap[0].Name)"

      # 只留发布所需的产物：win-unpacked 有几万个文件、体积数倍于安装包，
      # 传上去既慢又没人下载。更新清单按名字收两个——release/*.yml 会把
      # electron-builder 的 builder-debug.yml 一起带进 Release。
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            release/*.exe
            release/*.7z
            release/latest.yml
            release/beta.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
