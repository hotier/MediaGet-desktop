name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本不在这里硬编码：action-setup 会读 package.json 的 packageManager 字段，
      # 于是本机与 CI 永远同一档；升 pnpm 只改那一个字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test (vitest, offline)
        run: pnpm run test

  landing:
    name: 落地页构建（离线档 + 产物自检）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本不在这里硬编码：action-setup 会读 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # 离线档：不碰 GitHub 也要能构建。这里验的是页面本身（index.astro / astro.config /
      # 图标镜像）没坏，版本数据真假由 release.yml 的 landing job 负责。
      - run: pnpm run landing:build

      # 三条都是「构建成功但页面是坏的」那种静默失败：
      # 1. 资源引用必须已改成文档相对（./_astro/）——残留根绝对路径意味着子路径托管或
      #    双击打开时 CSS/JS 全 404，而 astro build 一声不响；
      # 2. 平台带数量与页面写出的数字必须自洽——带子由 shared/platforms.ts 生成，一旦有人
      #    把平台名/数量重新抄回页面，这里当天红；
      # 3. 每一个被引用的图标都真的落了盘（landing/public/logos 是生成物，缺谁碎谁）。
      - name: Assert artifact is location-independent and complete
        shell: bash
        run: |
          set -euo pipefail
          page=landing/dist/index.html
          if grep -q '"/_astro/' "$page"; then
            echo "产物里还有站点根绝对路径的资源引用，relative-output 改写没生效" >&2
            exit 1
          fi
          grep -q '"\./_astro/' "$page" || { echo "产物里没有 ./_astro/ 引用，构建形态变了" >&2; exit 1; }
          # 图标有两处出处：平台带 + 界面模拟里的表格，所以先把 .platform-list 区间切出来。
          # 走马灯为了无缝循环把同一段轨道排了四份拷贝，这里按文件名去重再数——数出来是「几枚
          # 图标」而不是「几个 <img>」，改轨道份数不会把这条断言带崩。
          # 标题只写「平台支持」、不带数字，数量对齐改用页内唯一那句承诺（meta description
          # 的「支持 N 个平台」）：加一个平台时两处都来自注册表，少一处跟上就红。
          wall=$(sed -n '/class="platform-list"/,/\/ul>/p' "$page" | grep -o 'src="\./logos/[^"]*"' | sort -u | wc -l)
          [ "$wall" -ge 1 ] || { echo "平台带一枚图标都没有" >&2; exit 1; }
          grep -q "支持 $wall 个平台" "$page" || { echo "平台带有 $wall 枚图标，页面却不说「支持 $wall 个平台」" >&2; exit 1; }
          for f in $(grep -o 'src="\./logos/[^"]*"' "$page" | sed 's|src="\./logos/||; s|"$||' | sort -u); do
            [ -f "landing/dist/logos/$f" ] || { echo "页面引用了 logos/$f，dist/logos 里没有这个文件" >&2; exit 1; }
          done
          refs=$(grep -o 'src="\./logos/[^"]*"' "$page" | sed 's|src="\./logos/||; s|"$||' | sort -u | wc -l)
          echo "OK：$wall 个平台、全页引用 $refs 枚图标全部在位、资源引用全部文档相对"

  build-win:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本不在这里硬编码：action-setup 会读 package.json 的 packageManager 字段，
      # 于是本机与 CI 永远同一档；升 pnpm 只改那一个字段。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 固定 tag + 强校验 SHA-256，并产出 resources/bin/manifest.json（首启校验用）。
      # 不要退回 `curl -sL -o .../latest/download/...`：不带 --fail 时 404 的 HTML
      # 错误页会被原样写成 .exe，构建成功但产物是垃圾（静默投毒）。
      - name: Fetch yt-dlp / ffmpeg binaries (pinned + verified)
        run: node scripts/fetch-binaries.cjs
      # 守门人：manifest.json 是运行时完整性校验的唯一基线，缺了它应用会静默降级成
      # 「只定位不校验」。在打包前断言清单在位且与二进制自洽，让问题在构建期暴露。
      - name: Verify binaries + manifest before packaging
        run: node scripts/fetch-binaries.cjs --verify-only --require-all
      # 只构建、不发布：package.json 的 build.publish 配了 GitHub provider，
      # electron-builder 在 CI 里会默认尝试上传 Release，而本 job 没有 GH_TOKEN
      # ——实测报 "GitHub Personal Access Token is not set"。发布是 tag 工作流的事，
      # 所以这里不复用 `pnpm run build`（它会带上 auto-publish 语义），显式 never。
      - name: Build app + installer
        run: pnpm run build:app && pnpm exec electron-builder --win --publish never
      # 产物自检：安装包里必须真的带上 bin/ 与 manifest.json（extraResources 配错
      # 时构建仍会成功，但用户机器上两个二进制都不可用）。
      - name: Assert packaged resources landed in the installer
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem -Path release -Recurse -Directory -Filter 'win-unpacked' | Select-Object -First 1
          if (-not $unpacked) { throw "release/win-unpacked 不存在：打包产物缺失" }
          $bin = Join-Path $unpacked.FullName 'resources\bin'
          foreach ($f in @('yt-dlp.exe','ffmpeg.exe','manifest.json')) {
            $p = Join-Path $bin $f
            if (-not (Test-Path $p)) { throw "安装包内缺少 resources\bin\$f" }
            Write-Host "  OK $f ($((Get-Item $p).Length) 字节)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mediaget-desktop-win
          path: release/*
          if-no-files-found: warn
