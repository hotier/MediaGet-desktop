# Windows: pnpm 默认 isolated linker 在 peer 循环图上触发 symlink 栈溢出（本机 pnpm 11.22 实测）；
# hoisted 与 npm 布局一致，electron-builder 兼容性最好。
nodeLinker: hoisted

packages:
  # 落地页（Astro 静态站）：单 lockfile，命令经 pnpm --filter mediaget-landing 调用
  - landing
allowBuilds:
  # esbuild 平台二进制走 optionalDependencies（win32-x64 已就位）；
  # install.js 兜底脚本在沙箱内 spawn 会 EPERM，明确关闭
  esbuild: false
  # electron-winstaller 仅打包 nsis 阶段需要（CI/发布机自然触发）；骨架期跳过
  electron-winstaller: false
  # Astro 依赖树里的 sharp：落地页全 SVG、不用 astro:assets，不需要其 install 脚本
  sharp: false
  better-sqlite3: true
  # ytdlp-nodejs 的 postinstall 会往包内 ./bin 自下载 yt-dlp（绕开 binaries.json 的
  # SHA-256 基线）——明确不跑。引擎只经 resources.locate("yt-dlp") 消费随包/自备二进制
  ytdlp-nodejs: false
minimumReleaseAgeExclude:
  - electron@44.7.2
  - lucide-react@1.57.0
  # 内核工件 2026-10-15 首发，仍在发布年龄窗口内；超过 cutoff 后删除本行
  # （1.1.1 = 2026-10-18 上游修小红书解析那一版，发布当天同样落在窗口内）
  - "@mediaget/parse-core@1.0.0 || 1.1.0 || 1.1.1"
  - astro@7.4.1

# 根 package.json 里的 cookie@2.0.1 是布局钉、不是业务依赖：hoisted 下 astro 要
# cookie@2，@mediaget/parse-core → express 要 cookie@0.7。干净安装会让 0.7.1 占住
# 根位置，astro 的 `import { parseCookie } from 'cookie'` 在 CI 直接报 "CommonJS
# module"（本地增量安装反而绿）。直接依赖保证 2.0.1 永远在根、0.7.1 缩进 express。
overrides:
  # app-builder-lib@26.15.x 声明 "@electron/get": "^3.0.0"，但它的
  # resolveCacheMode() 读的是 ElectronDownloadCacheMode —— 该枚举 3.1.0 才加入。
  # lockfile 把嵌套那支钉在 3.0.0 上，导致打包阶段抛
  # "Cannot read properties of undefined (reading 'ReadWrite')"。
  # 精确只抬 3.x 这一支，不碰 electron 自己需要的 5.x。
  # 上游修好（声明改为 ^3.1.0 或更高）后可删本 override。
  "@electron/get@^3.0.0": "3.1.0"

# 注意：不要在这里写死 storeDir 绝对路径（如 D:\dsh_store\.pnpm-store）——
# 那是开发机专属路径，泄漏进共享配置后换机器/CI 会失效。需要自定义 store
# 位置时用环境变量 PNPM_STORE_DIR 或 `pnpm config set store-dir`，属本机配置。
